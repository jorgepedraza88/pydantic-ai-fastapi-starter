[tool.ruff]
# Same compatibility target as Black
target-version = "py313"
line-length = 88

# Enable linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]

# Ignore some rules
ignore = [
    "E501",  # lines too long
]

# Allow autofix for all selected rules
fix = true
unsafe-fixes = false

# Allow unused versions (noqa)
respect-noqa = true

[tool.ruff.format]
# Like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"